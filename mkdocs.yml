site_name: Cyber With CJ
site_url: https://cyberwithcj.com
site_description: Practical cybersecurity notes, references, and authorised lab write-ups.
site_author: Chirag Menariya
copyright: Copyright © 2026 Cyber With CJ
theme:
  name: material
  custom_dir: overrides
  language: en
  generator: false
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: black
      accent: cyan
      toggle: {icon: material/weather-sunny, name: Switch to dark mode}
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: black
      accent: cyan
      toggle: {icon: material/weather-night, name: Switch to light mode}
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - navigation.tracking
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate
  font: {text: Inter, code: JetBrains Mono}
extra_css: [stylesheets/extra.css]
extra_javascript: [javascripts/toc-dropdown.js]
extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/ChiragMenariyaCJ
      name: Chirag Menariya on GitHub
    - icon: fontawesome/brands/linkedin
      link: https://www.linkedin.com/in/chirag-menariya/
      name: Chirag Menariya on LinkedIn
markdown_extensions:
  - admonition
  - tables
  - attr_list
  - md_in_html
  - pymdownx.highlight
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.details
  - toc:
      permalink: false
nav:
  - Home: index.md
  - About: about.md
  - Networking: networking/index.md
  - Linux: linux/index.md
  - Penetration Testing: penetration-testing/index.md
  - Web Security: web-security/index.md
  - API Security: api-security/index.md
  - Active Directory: active-directory/index.md
  - Tools:
      - tools/index.md
      - Nmap: tools/nmap.md
  - Cheatsheets: cheatsheets/index.md
  - Labs: labs/index.md
plugins:
  - search
