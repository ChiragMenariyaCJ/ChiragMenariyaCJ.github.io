site_name: Cyber With CJ
site_url: https://cyberwithcj.com
site_author: Chirag Menariya
repo_name: Cyber With CJ
copyright: Copyright © 2026 Cyber With CJ
theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: black
      accent: cyan
      toggle: {icon: material/weather-sunny, name: Switch to dark mode}
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: black
      accent: cyan
      toggle: {icon: material/weather-night, name: Switch to light mode}
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - navigation.tracking
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate
  font: {text: Inter, code: JetBrains Mono}
extra_css: [stylesheets/extra.css]
markdown_extensions:
  - admonition
  - tables
  - attr_list
  - md_in_html
  - pymdownx.highlight
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.details
  - toc:
      permalink: true
nav:
  - Home: index.md
  - Networking: networking/index.md
  - Linux: linux/index.md
  - Penetration Testing: penetration-testing/index.md
  - Web Security: web-security/index.md
  - API Security: api-security/index.md
  - Active Directory: active-directory/index.md
  - Tools:
      - tools/index.md
      - Nmap: tools/nmap.md
  - Cheatsheets: cheatsheets/index.md
  - Labs: labs/index.md
plugins:
  - search
